function describeColor(color, L) {
  if (!color) return L.noColour;
  if (color.mode === 'static') return L.fixed + ' ' + color.value;
  if (color.mode === 'threshold') {
    return L.thresholds + ' ' + (color.stops || []).map(([at, hex]) => at + '→' + hex).join(', ');
  }
  if (color.mode === 'gradient') {
    return L.gradient + ' ' + color.from + '→' + color.to + ' ' + L.over + ' ' + color.min + '–' + color.max;
  }
  return color.mode;
}

function describeFormat(format) {
  const f = format || {};
  const bits = [f.type || 'text'];
  for (const key of ['decimals', 'mode', 'max', 'slice', 'prefix', 'suffix', 'onLabel', 'abbrev']) {
    if (f[key] !== undefined) bits.push(key + '=' + f[key]);
  }
  return bits.join(' ');
}

function describeSource(segment, L) {
  if (isBlock(segment)) return L.literal(segment.source.value);
  if (segment.source && segment.source.kind === 'derived') return L.derived(segment.source.fn);
  return L.field(segment.source ? segment.source.path : '?');
}

function generatePrompt(config, opts = {}) {
  const cfg = normaliseConfig(config);
  const installPath = opts.installPath || DEFAULT_INSTALL_PATH;
  const L = PROMPT_TEXT[opts.lang || lang()] || PROMPT_TEXT.en;

  const lines = [];
  for (let line = 0; line < cfg.lineCount; line++) {
    const onThisLine = cfg.segments.filter(s => (Number(s.line) || 0) === line);
    if (!onThisLine.length) continue;
    lines.push('');
    lines.push('**' + L.line(line + 1) + '** — ' + L.separator + ' `' + cfg.separators[line] + '`' +
      (cfg.dimSeparator ? ' ' + L.dimmed : ''));
    onThisLine.forEach((s, i) => {
      const parts = [
        (i + 1) + '. `' + s.id + '`',
        describeSource(s, L),
        L.format + ': ' + describeFormat(s.format),
        L.colour + ': ' + describeColor(s.color, L)
      ];
      if (s.showEmoji !== false && s.emoji) parts.push(L.emoji + ': ' + s.emoji);
      if (s.showLabel && s.label) parts.push(L.label + ': ' + s.label);
      lines.push('   - ' + parts.join(' · '));
    });
  }

  return [
    L.intro,
    '',
    L.goalHead,
    '',
    ...L.goal(installPath),
    '',
    '```json',
    '"statusLine": { "type": "command", "command": "node ' + installPath + '" }',
    '```',
    '',
    L.layoutHead,
    '',
    L.lineCount(cfg.lineCount),
    L.order,
    ...lines,
    '',
    L.rulesHead,
    '',
    ...L.rules,
    '',
    L.configHead,
    '',
    L.configIntro,
    '',
    '```json',
    generateConfigJson(cfg),
    '```'
  ].join('\n');
}

// ---- installation helpers, per operating system ----

const OSES = ['windows', 'macos', 'linux'];

const INSTALL_PATHS = {
  windows: DEFAULT_INSTALL_PATH,
  macos: '~/.claude/statusline.js',
  linux: '~/.claude/statusline.js'
};

const SHELL_NAMES = { windows: 'PowerShell', macos: 'Terminal', linux: 'Terminal' };

const toWindowsPath = p => String(p).replace(/\//g, '\\');
const toPosixPath = p => String(p).replace(/\\/g, '/');

// A tilde has to survive unquoted or it will not expand, so it becomes $HOME —
// that expands inside double quotes and still tolerates spaces in the path.
function posixTarget(p) {
  const path = toPosixPath(p);
  return path.startsWith('~') ? '"$HOME' + path.slice(1) + '"' : '"' + path + '"';
}

function shellQuote(path) {
  const p = String(path);
  if (p.startsWith('~')) return p;
  return /\s/.test(p) ? '"' + p + '"' : p;
}

// Writes the clipboard straight into the target file — no download involved.
function writeToFileCommand(os, installPath) {
  const path = installPath || INSTALL_PATHS[os] || DEFAULT_INSTALL_PATH;
  if (os === 'macos') return 'pbpaste > ' + posixTarget(path);
  if (os === 'linux') return 'xclip -selection clipboard -o > ' + posixTarget(path);
  return 'Get-Clipboard -Raw | Set-Content -Encoding utf8 "' + toWindowsPath(path) + '"';
}

// Prints the first line, which must be the node shebang. A leading brace means
// the config was copied instead of the script.
function verifyCommand(os, installPath) {
  const path = installPath || INSTALL_PATHS[os] || DEFAULT_INSTALL_PATH;
  if (os === 'windows') return 'Get-Content "' + toWindowsPath(path) + '" -TotalCount 1';
  return 'head -1 ' + posixTarget(path);
}

function generateSettingsSnippet(installPath, os) {
  const path = installPath || INSTALL_PATHS[os] || DEFAULT_INSTALL_PATH;
  const shown = os === 'macos' || os === 'linux' ? toPosixPath(path) : path;
  return JSON.stringify(
    { statusLine: { type: 'command', command: 'node ' + shellQuote(shown) } },
    null,
    2
  );
}

// ---------- src/state.js ----------
// One state object, one persistence key, one notification channel.


const KEY = 'statusline-builder:v1';

function detectOs() {
  try {
    const ua = String((navigator.userAgent || '') + ' ' + (navigator.platform || '')).toLowerCase();
    if (ua.includes('mac')) return 'macos';
    if (ua.includes('win')) return 'windows';
    if (ua.includes('linux') || ua.includes('x11') || ua.includes('android')) return 'linux';
  } catch {
    // No navigator (tests, odd embeddings) — Windows is the safe default here.
  }
  return 'windows';
}

function defaultState() {
  const os = detectOs();
  return {
    os,
    lang: detectLang(),
    segments: REFERENCE_ORDER.map(id => ({ ...CATALOG_BY_ID[id] })),
    separator: DEFAULT_SEPARATOR,
    separators: Array.from({ length: MAX_LINES }, () => DEFAULT_SEPARATOR),
    dimSeparator: true,
    lineCount: 1,
    sort: 'manual',
    preview: { ctx: 10, fiveHour: 1, sevenDay: 32 },
    installPath: INSTALL_PATHS[os] || DEFAULT_INSTALL_PATH,
    tab: 'script',
    loadDraft: ''
  };
}

// Catalogue fields win for anything the user never touched, so an old saved
// state still picks up catalogue fixes. Blocks are user-made and carry
// themselves — they have no catalogue entry to merge with.
function rehydrate(segments) {
  if (!Array.isArray(segments)) return defaultState().segments;
  return segments
    .filter(s => s && (isBlock(s) || CATALOG_BY_ID[s.id]))
    .map(s => (isBlock(s) ? { ...s } : { ...CATALOG_BY_ID[s.id], ...s }));
}

function normaliseSeparators(stored, fallback) {
  const given = Array.isArray(stored) ? stored : [];
  return Array.from({ length: MAX_LINES }, (_, i) =>
    (typeof given[i] === 'string' ? given[i] : fallback));
}

function load() {
  const base = defaultState();
  try {
    const stored = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!stored) return base;
    if (LANGS.indexOf(stored.lang) === -1) stored.lang = base.lang;
    const separator = typeof stored.separator === 'string' ? stored.separator : base.separator;
    return {
      ...base,
      ...stored,
      separator,
      separators: normaliseSeparators(stored.separators, separator),
      segments: rehydrate(stored.segments),
      preview: { ...base.preview, ...(stored.preview || {}) }
    };
  } catch {
    return base;
  }
}

let state = null;
const listeners = new Set();

function getState() {
  if (!state) {
    state = load();
    setLang(state.lang);
  }
  return state;
}

function setLanguage(value) {
  patch({ lang: setLang(value) });
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function commit() {
  const current = getState();
  try {
    localStorage.setItem(KEY, JSON.stringify(current));
  } catch {
    // Private mode or a full quota: the app still works, it just forgets.
  }
  listeners.forEach(fn => fn(current));
}

function patch(values) {
  Object.assign(getState(), values);
  commit();
}

function reset() {
  state = defaultState();
  commit();
}

function toConfig() {
  const s = getState();
  return {
    segments: s.segments,
    separator: s.separator,
    separators: s.separators,
    dimSeparator: s.dimSeparator,
    lineCount: s.lineCount
  };
}

// ---------- src/ui-export.js ----------
// Preview rendering, the export panel, and reading an existing status line back in.


const HOUR = 3600 * 1000;

const MONO_STACK = 'ui-monospace, "Cascadia Code", Consolas, monospace';
const SANS_STACK = 'ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif';

// Canvas gives the same advances the SVG renderer will use, including the
// double-width emoji. Without a canvas we fall back to a terminal-cell estimate.
function makeMeasurer() {
  let context = null;
  try {
    const canvas = document.createElement('canvas');
    context = canvas.getContext ? canvas.getContext('2d') : null;
  } catch {
    context = null;
  }

  return (text, size, family) => {
    if (context) {
      context.font = size + 'px ' + (family === 'mono' ? MONO_STACK : SANS_STACK);
      return context.measureText(String(text)).width;
    }
    const chars = Array.from(String(text));
    if (family === 'mono') {
      return chars.reduce((n, c) => n + (c.codePointAt(0) > 0x2000 ? 2 : 1), 0) * size * 0.6;
    }
    return chars.length * size * 0.55;
  };
}

function cheatsheetSvg() {
  return buildCheatsheetSvg(toConfig(), previewPayload(), makeMeasurer(), { now: Date.now() });
}

// Rasterises through an <img>, which the browser renders with local fonts. The
// SVG has no external references, so nothing can be blocked here.
function svgToPngBlob(svg, scale = 2) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    const image = new Image();
    image.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = image.naturalWidth * scale;
        canvas.height = image.naturalHeight * scale;
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        context.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => (blob ? resolve(blob) : reject(new Error(tt('err.pngBlob')))), 'image/png');
      } catch (error) {
        URL.revokeObjectURL(url);
        reject(error);
      }
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error(tt('err.pngRender')));
    };
    image.src = url;
  });
}

// SAMPLE_PAYLOAD is injected by build.js from sample-payload.json.
function previewPayload() {
  const { preview } = getState();
  const now = Date.now();
  const base = JSON.parse(JSON.stringify(SAMPLE_PAYLOAD));

  base.context_window.used_percentage = preview.ctx;
  base.context_window.remaining_percentage = 100 - preview.ctx;
  base.rate_limits.five_hour.used_percentage = preview.fiveHour;
  base.rate_limits.seven_day.used_percentage = preview.sevenDay;

  // The fixture's timestamps are fixed, which would render every countdown as
  // "now". Anchor them to the current clock so the preview stays meaningful.
  base.rate_limits.five_hour.resets_at = Math.round((now + 4.9 * HOUR) / 1000);
  base.rate_limits.seven_day.resets_at = Math.round((now + 4.2 * 24 * HOUR) / 1000);
  return base;
}

function renderPreview(el, readoutEl) {
  const payload = previewPayload();
  el.innerHTML = renderHtml(toConfig(), payload, Date.now());

  const now = Date.now();
  const bits = [
    [tt('readout.today'), todayLeft(payload, now), '%'],
    [tt('readout.pace'), pace(payload, now), '%/d'],
    [tt('readout.burn'), evenBurn(payload, now), '']
  ]
    .filter(([, v]) => v !== null)
    .map(([label, v, unit]) => label + ' ' + v.toFixed(0) + unit);
  readoutEl.textContent = bits.join('  ·  ');
}

const hintFor = tab => tt('hint.' + tab);

function exportText(tab) {
  const config = toConfig();
  if (tab === 'prompt') return generatePrompt(config, { installPath: getState().installPath });
  if (tab === 'config') return generateConfigJson(config);
  return generateScript(config);
}

const FILENAMES = {
  script: 'statusline.js',
  prompt: 'statusline-prompt.md',
  config: 'statusline-config.json'
};

function inIframe() {
  try {
    return window.self !== window.top;
  } catch {
    return true;
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoking straight away can cancel the download before it starts.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function download(tab, text) {
  // text/plain makes browsers append .txt to a .js filename; octet-stream keeps
  // the name from the download attribute intact.
  downloadBlob(new Blob([text], { type: 'application/octet-stream' }), FILENAMES[tab] || 'statusline.txt');
}

async function copyText(text, button, node) {
  if (!button.dataset.label) button.dataset.label = button.textContent;
  const original = button.dataset.label;

  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    ok = false;
  }
  if (!ok && node) {
    // Clipboard API needs a permission the artifact sandbox may withhold.
    try {
      node.focus();
      node.select();
      ok = document.execCommand('copy');
    } catch {
      ok = false;
    }
  }

  button.textContent = ok ? tt('action.copied') : tt('action.copyFailed');
  setTimeout(() => { button.textContent = original; }, 1800);
}

function importConfig(text) {
  const config = parseAnyConfig(text);
  patch({
    segments: config.segments,
    separator: config.separator,
    separators: config.separators,
    dimSeparator: config.dimSeparator,
    lineCount: config.lineCount,
    sort: 'manual'
  });
  return config;
}

let lastTab = null;
let lastHintLang = null;

function mountExport(dom, rebuild) {
  dom.tabs.forEach(button => {
    button.addEventListener('click', () => patch({ tab: button.dataset.tab }));
  });

  dom.copy.addEventListener('click', () => copyText(dom.out.value, dom.copy, dom.out));

  dom.download.addEventListener('click', () => {
    download(getState().tab, dom.out.value);
    if (inIframe()) {
      // Nothing in the page can lift a sandbox download block, so fall straight
      // through to the path that always works: select the text for copying.
      try {
        dom.out.focus();
        dom.out.select();
      } catch {
        // Selecting is a convenience; ignore browsers that refuse it.
      }
      dom.hint.textContent = tt('download.sandboxed');
    }
  });

  dom.import.addEventListener('click', () => {
    let config;
    try {
      config = importConfig(dom.out.value);
    } catch (error) {
      dom.hint.textContent = error.message;
      return;
    }
    patch({ tab: 'script' });
    rebuild();
    dom.hint.textContent = tt('load.done', { segments: config.segments.length, lines: config.lineCount });
  });

  if (dom.loadFile) {
    dom.loadFile.addEventListener('change', () => {
      const file = dom.loadFile.files && dom.loadFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        dom.out.value = String(reader.result || '');
        if (dom.loadFileName) dom.loadFileName.textContent = file.name;
        dom.hint.textContent = tt('load.fileRead');
      };
      reader.onerror = () => { dom.hint.textContent = tt('load.fileFailed'); };
      reader.readAsText(file);
    });
  }

  // Always the script, never whatever tab happens to be open — copying the
  // Config tab by mistake produces a file Node cannot run.
  if (dom.copyScript) {
    dom.copyScript.addEventListener('click', () =>
      copyText(exportText('script'), dom.copyScript, null));
  }

  if (dom.copyCommand) {
    dom.copyCommand.addEventListener('click', () => {
      const { os, installPath } = getState();
      copyText(writeToFileCommand(os, installPath), dom.copyCommand, dom.installCommand);
    });
  }

  if (dom.cheatSvg) {
    dom.cheatSvg.addEventListener('click', () =>
      downloadBlob(new Blob([cheatsheetSvg()], { type: 'image/svg+xml;charset=utf-8' }), 'statusline-cheatsheet.svg'));
  }

  if (dom.cheatCopy) {
    dom.cheatCopy.addEventListener('click', () => copyText(cheatsheetSvg(), dom.cheatCopy, null));
  }

  if (dom.cheatPng) {
    dom.cheatPng.addEventListener('click', () => {
      const button = dom.cheatPng;
      const label = button.dataset.label || button.textContent;
      button.dataset.label = label;
      button.textContent = tt('action.rendering');
      svgToPngBlob(cheatsheetSvg())
        .then(blob => {
          downloadBlob(blob, 'statusline-cheatsheet.png');
          button.textContent = label;
        })
        .catch(error => {
          button.textContent = label;
          dom.hint.textContent = tt('cheat.pngFailed', { message: error.message });
        });
    });
  }

  dom.osButtons.forEach(button => {
    button.addEventListener('click', () => {
      const os = button.dataset.os;
      // Switching platform swaps in that platform's conventional path.
      patch({ os, installPath: INSTALL_PATHS[os] });
    });
  });

  dom.installPath.addEventListener('input', () => patch({ installPath: dom.installPath.value }));
}

function renderExport(dom) {
  const { tab, installPath, os } = getState();
  const tabChanged = tab !== lastTab;
  lastTab = tab;

  dom.tabs.forEach(button => {
    button.setAttribute('aria-selected', String(button.dataset.tab === tab));
  });

  const isCheat = tab === 'cheat';
  dom.out.hidden = isCheat;
  if (dom.cheatPanel) dom.cheatPanel.hidden = !isCheat;

  if (isCheat) {
    if (dom.cheatPreview) dom.cheatPreview.innerHTML = cheatsheetSvg();
  } else if (tab === 'load') {
    // Only clear on arrival, so a paste survives the re-render that follows it.
    if (tabChanged) {
      dom.out.value = '';
      if (dom.loadFileName) dom.loadFileName.textContent = '';
    }
    dom.out.readOnly = false;
    dom.out.placeholder = tt('load.placeholder');
  } else {
    // Export views are read-only, so there is never a user edit to protect —
    // always rewrite them, otherwise they go stale after an import.
    dom.out.value = exportText(tab);
    dom.out.readOnly = true;
    dom.out.placeholder = '';
  }

  // The cheat sheet and the load view bring their own buttons.
  dom.import.hidden = tab !== 'load';
  dom.download.hidden = tab === 'load' || isCheat;
  dom.copy.hidden = tab === 'load' || isCheat;
  if (dom.loadControls) dom.loadControls.hidden = tab !== 'load';
  // The hint also has to follow a language switch, not just a tab change.
  const currentLang = lang();
  if (tabChanged || lastHintLang !== currentLang) dom.hint.textContent = hintFor(tab);
  lastHintLang = currentLang;

  dom.osButtons.forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.os === os));
  });

  if (document.activeElement !== dom.installPath) dom.installPath.value = installPath;
  dom.snippet.value = generateSettingsSnippet(installPath, os);
  if (dom.installCommand) dom.installCommand.value = writeToFileCommand(os, installPath);
  if (dom.verifyCommand) dom.verifyCommand.value = verifyCommand(os, installPath);
  if (dom.shellName) dom.shellName.textContent = SHELL_NAMES[os] || 'Terminal';
}

// ---------- src/ui.js ----------
// Catalogue, builder rows, and the wiring that ties everything to state.


const el = (tag, props = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, '');
    else if (value !== false && value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const child of [].concat(children)) if (child) node.appendChild(child);
  return node;
};

const FORMAT_CHOICES = {
  path: [
    { key: 'fmt.basename', patch: { mode: 'basename' } },
    { key: 'fmt.last2', patch: { mode: 'last2' } },
    { key: 'fmt.full', patch: { mode: 'full' } },
    { key: 'fmt.tilde', patch: { mode: 'tilde' } }
  ],
  percent: [
    { key: 'fmt.int', patch: { decimals: 0 } },
    { key: 'fmt.decimal1', patch: { decimals: 1 } }
  ],
  number: [
    { key: 'fmt.short', patch: { abbrev: true } },
    { key: 'fmt.long', patch: { abbrev: false } }
  ],
  text: [
    { key: 'fmt.textFull', patch: { max: 0, slice: 0 } },
    { key: 'fmt.max12', patch: { max: 12, slice: 0 } },
    { key: 'fmt.max24', patch: { max: 24, slice: 0 } },
    { key: 'fmt.first8', patch: { max: 0, slice: 8 } }
  ],
  bool: [
    { key: 'fmt.onlyOn', patch: { hideWhenFalse: true } },
    { key: 'fmt.always', patch: { hideWhenFalse: false, offLabel: 'off' } }
  ],
  arrow: [
    { key: 'fmt.arrowInt', patch: { decimals: 0 } },
    { key: 'fmt.arrowDecimal', patch: { decimals: 1 } }
  ],
  emojiScale: [
    { key: 'fmt.cats', patch: { stops: MOOD_STOPS } },
    { key: 'fmt.traffic', patch: { stops: [[0, '🟢'], [50, '🟡'], [75, '🟠'], [90, '🔴']] } },
    { key: 'fmt.weather', patch: { stops: [[0, '☀️'], [40, '⛅'], [65, '🌧️'], [85, '⛈️']] } },
    { key: 'fmt.battery', patch: { stops: [[0, '🔋'], [50, '🪫']] } }
  ],
  countdown: [{ key: 'fmt.countdown', patch: {} }],
  duration: [{ key: 'fmt.duration', patch: {} }],
  currency: [{ key: 'fmt.currency', patch: {} }],
  count: [{ key: 'fmt.count', patch: {} }],
  raw: [{ key: 'fmt.raw', patch: {} }]
};

const COLOR_CHOICES = [
  { id: 'default', key: 'color.default' },
  { id: 'usage', key: 'color.usage' },
  { id: 'inverse', key: 'color.inverse' },
  { id: 'static', key: 'color.static' },
  { id: 'gradient', key: 'color.gradient' }
];

const GRADIENT = { mode: 'gradient', from: '#7ec699', to: '#e06c75', min: 0, max: 100 };

function sameValue(a, b) {
  if (typeof a === 'number' || typeof b === 'number') return (Number(a) || 0) === (Number(b) || 0);
  if (typeof a === 'boolean' || typeof b === 'boolean') return Boolean(a) === Boolean(b);
  if (a && typeof a === 'object') return JSON.stringify(a) === JSON.stringify(b);
  return String(a === undefined || a === null ? '' : a) === String(b === undefined || b === null ? '' : b);
}

function formatChoices(segment) {
  return FORMAT_CHOICES[(segment.format || {}).type || 'text'] || [];
}

function activeFormatChoice(segment) {
  const choices = formatChoices(segment);
  const index = choices.findIndex(choice =>
    Object.keys(choice.patch).every(key => sameValue((segment.format || {})[key], choice.patch[key])));
  return index === -1 ? 0 : index;
}

function activeColorChoice(segment) {
  const fallback = (CATALOG_BY_ID[segment.id] || {}).color;
  if (fallback && JSON.stringify(fallback) === JSON.stringify(segment.color)) return 'default';
  const color = segment.color || {};
  if (color.mode === 'gradient') return 'gradient';
  if (color.mode === 'static') return 'static';
  if (JSON.stringify(color.stops) === JSON.stringify(USAGE.stops)) return 'usage';
  if (JSON.stringify(color.stops) === JSON.stringify(INVERSE.stops)) return 'inverse';
  return 'default';
}

function colorFor(choiceId, segment) {
  if (choiceId === 'usage') return { ...USAGE };
  if (choiceId === 'inverse') return { ...INVERSE };
  if (choiceId === 'gradient') return { ...GRADIENT };
  if (choiceId === 'static') {
    const current = segment.color || {};
    return { mode: 'static', value: current.mode === 'static' ? current.value : '#c8ccd4' };
  }
  return { ...((CATALOG_BY_ID[segment.id] || {}).color || { mode: 'static', value: '#c8ccd4' }) };
}

const select = (options, selected, onChange) => {
  const node = el('select', { onchange: event => onChange(event.target.value) });
  for (const option of options) {
    node.appendChild(el('option', { value: option.value, text: option.label }));
  }
  node.value = selected;
  return node;
};

// ---- tooltips ----
//
// One shared node, positioned under whatever is hovered or focused. Native
// title attributes would do the job but arrive after a delay and cannot carry
// the source path on its own line.

let tipNode = null;

function tooltip() {
  if (!tipNode) {
    tipNode = el('div', { class: 'tip', role: 'tooltip' });
    tipNode.hidden = true;
    document.body.appendChild(tipNode);
  }
  return tipNode;
}

function sourceLabel(segment) {
  if (!segment || !segment.source) return '';
  if (segment.source.kind === 'literal') return tt('tip.literal');
  if (segment.source.kind === 'derived') return tt('tip.derived', { fn: segment.source.fn });
  return segment.source.path;
}

function positionTip(node, target) {
  if (!target.getBoundingClientRect) return;
  const rect = target.getBoundingClientRect();
  const own = node.getBoundingClientRect ? node.getBoundingClientRect() : null;
  const width = (own && own.width) || 260;
  const viewport = (typeof window !== 'undefined' && window.innerWidth) || 1200;
  node.style.left = Math.round(Math.max(10, Math.min(viewport - width - 10, rect.left))) + 'px';
  node.style.top = Math.round(rect.bottom + 8) + 'px';
}

function showTip(target, segment) {
  const help = helpText(segment, lang());
  const source = sourceLabel(segment);
  if (!help && !source) return;
  const node = tooltip();
  const children = [el('div', { class: 'tip__title', text: segment.label || segment.id })];
  if (help) children.push(el('div', { class: 'tip__body', text: help }));
  if (source) children.push(el('div', { class: 'tip__src', text: source }));
  node.replaceChildren(...children);
  node.hidden = false;
  positionTip(node, target);
}

function hideTip() {
  if (tipNode) tipNode.hidden = true;
}

function attachTip(target, segment) {
  target.addEventListener('mouseenter', () => showTip(target, segment));
  target.addEventListener('mouseleave', hideTip);
  target.addEventListener('focus', () => showTip(target, segment));
  target.addEventListener('blur', hideTip);
}

function mount() {
  const dom = {
    preview: document.getElementById('preview'),
    readout: document.getElementById('derived-readout'),
    catalog: document.getElementById('catalog'),
    rows: document.getElementById('rows'),
    separators: document.getElementById('separators'),
    dimSeparator: document.getElementById('dim-separator'),
    lineCount: document.getElementById('line-count'),
    sort: document.getElementById('sort'),
    clearAll: document.getElementById('clear-all'),
    addBlock: document.getElementById('add-block'),
    tabs: Array.from(document.querySelectorAll('.tab')),
    out: document.getElementById('export-out'),
    copy: document.getElementById('copy'),
    download: document.getElementById('download'),
    import: document.getElementById('import'),
    hint: document.getElementById('export-hint'),
    loadControls: document.getElementById('load-controls'),
    loadFile: document.getElementById('load-file'),
    loadFileName: document.getElementById('load-file-name'),
    cheatPanel: document.getElementById('cheat-panel'),
    cheatPreview: document.getElementById('cheat-preview'),
    cheatPng: document.getElementById('cheat-png'),
    cheatSvg: document.getElementById('cheat-svg'),
    cheatCopy: document.getElementById('cheat-copy'),
    installPath: document.getElementById('install-path'),
    installCommand: document.getElementById('install-command'),
    verifyCommand: document.getElementById('verify-command'),
    shellName: document.getElementById('shell-name'),
    copyScript: document.getElementById('copy-script'),
    copyCommand: document.getElementById('copy-command'),
    osButtons: Array.from(document.querySelectorAll('.os')),
    langButtons: Array.from(document.querySelectorAll('.lang')),
    snippet: document.getElementById('settings-snippet'),
    sliders: [
      ['ctx', document.getElementById('pv-ctx'), document.getElementById('pv-ctx-out')],
      ['fiveHour', document.getElementById('pv-5h'), document.getElementById('pv-5h-out')],
      ['sevenDay', document.getElementById('pv-7d'), document.getElementById('pv-7d-out')]
    ]
  };

  const refresh = () => {
    renderPreview(dom.preview, dom.readout);
    renderExport(dom);
  };

  const rebuild = () => {
    applyStaticStrings(dom);
    renderSeparators(dom);
    renderCatalog(dom, rebuild);
    renderRows(dom, rebuild);
    refresh();
  };

  dom.langButtons.forEach(button => {
    button.addEventListener('click', () => {
      setLanguage(button.dataset.lang);
      hideTip();
      rebuild();
    });
  });

  dom.dimSeparator.addEventListener('change', () => patch({ dimSeparator: dom.dimSeparator.checked }));

  dom.lineCount.addEventListener('change', () => {
    patch({ lineCount: Number(dom.lineCount.value) });
    rebuild();
  });

  dom.sort.addEventListener('change', () => {
    applySort(dom.sort.value);
    rebuild();
  });

  dom.clearAll.addEventListener('click', () => {
    patch({ segments: [] });
    rebuild();
  });

  dom.addBlock.addEventListener('click', () => {
    const segments = getState().segments.slice();
    segments.push(makeBlock(nextBlockId(segments)));
    patch({ segments, sort: 'manual' });
    rebuild();
  });

  for (const [key, input, output] of dom.sliders) {
    input.addEventListener('input', () => {
      getState().preview[key] = Number(input.value);
      output.textContent = input.value + '%';
      commit();
    });
  }

  mountExport(dom, rebuild);
  subscribe(() => refresh());

  const state = getState();
  dom.dimSeparator.checked = state.dimSeparator;
  dom.lineCount.value = String(state.lineCount);
  dom.sort.value = state.sort;
  for (const [key, input, output] of dom.sliders) {
    input.value = String(state.preview[key]);
    output.textContent = state.preview[key] + '%';
  }

  rebuild();
}

// Swaps the strings that live in the template rather than in JavaScript. The
// markup is authored in English, so a failure here degrades to English rather
// than to empty labels.
function applyStaticStrings(dom) {
  const each = (selector, apply) => {
    const nodes = document.querySelectorAll ? document.querySelectorAll(selector) : [];
    for (const node of nodes) apply(node);
  };

  each('[data-i18n]', node => { node.textContent = tt(node.getAttribute('data-i18n')); });
  each('[data-i18n-html]', node => { node.innerHTML = tt(node.getAttribute('data-i18n-html')); });
  each('[data-i18n-aria]', node => { node.setAttribute('aria-label', tt(node.getAttribute('data-i18n-aria'))); });

  const current = lang();
  dom.langButtons.forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.lang === current));
  });
  if (document.documentElement && document.documentElement.setAttribute) {
    document.documentElement.setAttribute('lang', current);
  }
}

function applySort(mode) {
  const state = getState();
  const segments = state.segments.slice();
  // Blocks are placed by hand, so they sort to the end rather than jumping to
  // the front on an unknown group.
  const groupRank = segment => {
    const index = GROUPS.map(g => g.id).indexOf(segment.group);
    return index === -1 ? GROUPS.length : index;
  };

  if (mode === 'alpha') {
    segments.sort((a, b) => a.id.localeCompare(b.id));
  } else if (mode === 'group') {
    segments.sort((a, b) => groupRank(a) - groupRank(b) || a.id.localeCompare(b.id));
  } else if (mode === 'reference') {
    const rank = id => {
      const index = REFERENCE_ORDER.indexOf(id);
      return index === -1 ? REFERENCE_ORDER.length : index;
    };
    segments.sort((a, b) => rank(a.id) - rank(b.id));
  }

  patch({ segments, sort: mode });
}

function renderSeparators(dom) {
  const state = getState();
  dom.separators.replaceChildren();

  for (let i = 0; i < state.lineCount; i++) {
    const index = i;
    dom.separators.appendChild(el('label', { class: 'sep-field' }, [
      el('span', {
        text: state.lineCount > 1
          ? tt('field.separatorLine', { n: index + 1 })
          : tt('field.separator')
      }),
      el('input', {
        type: 'text',
        list: 'sep-presets',
        value: state.separators[index],
        'aria-label': tt('field.separatorLine', { n: index + 1 }),
        oninput: event => {
          getState().separators[index] = event.target.value;
          if (index === 0) getState().separator = event.target.value;
          commit();
        }
      })
    ]));
  }
}

function renderCatalog(dom, rebuild) {
  const state = getState();
  const active = new Set(state.segments.map(s => s.id));
  dom.catalog.replaceChildren();

  for (const group of GROUPS) {
    const members = CATALOG.filter(s => s.group === group.id);
    if (!members.length) continue;

    const list = el('div', { class: 'group__list' });
    for (const segment of members) {
      const on = active.has(segment.id);
      const chip = el('button', {
        class: 'chip',
        type: 'button',
        'aria-pressed': String(on),
        'data-help': helpText(segment, lang()),
        onclick: () => {
          const current = getState();
          const next = active.has(segment.id)
            ? current.segments.filter(s => s.id !== segment.id)
            : current.segments.concat([{ ...segment }]);
          patch({ segments: next, sort: 'manual' });
          rebuild();
        }
      }, [
        segment.emoji ? el('span', { class: 'chip__emoji', text: segment.emoji }) : null,
        el('span', { text: segment.label })
      ]);
      attachTip(chip, segment);
      list.appendChild(chip);
    }

    dom.catalog.appendChild(el('div', { class: 'group' }, [
      el('div', { class: 'group__head' }, [
        el('span', { text: group.emoji }),
        el('span', { text: tt('group.' + group.id) })
      ]),
      list
    ]));
  }
}

function renderRows(dom, rebuild) {
  const state = getState();
  dom.rows.replaceChildren();

  if (!state.segments.length) {
    dom.rows.appendChild(el('p', { class: 'empty', text: tt('builder.empty') }));
    return;
  }

  const move = (from, to) => {
    const segments = getState().segments.slice();
    if (to < 0 || to >= segments.length) return;
    segments.splice(to, 0, segments.splice(from, 1)[0]);
    patch({ segments, sort: 'manual' });
    rebuild();
  };

  state.segments.forEach((segment, index) => {
    const block = isBlock(segment);
    const choices = formatChoices(segment);
    const colorId = activeColorChoice(segment);
    const catalogueLabel = (CATALOG_BY_ID[segment.id] || {}).label || '';

    const swatch = el('input', {
      class: 'row__swatch',
      type: 'color',
      value: (segment.color || {}).mode === 'static' ? (segment.color.value || '#c8ccd4') : '#c8ccd4',
      'aria-label': tt('row.colorAria', { id: segment.id }),
      oninput: event => {
        segment.color = { mode: 'static', value: event.target.value };
        commit();
      }
    });
    swatch.hidden = colorId !== 'static';

    // Blocks carry their own text; catalogue segments get a format dropdown.
    const contentCell = block
      ? el('input', {
          class: 'row__block',
          type: 'text',
          value: segment.source.value,
          placeholder: tt('row.blockPlaceholder'),
          'aria-label': tt('row.blockAria'),
          oninput: event => {
            segment.source = { kind: 'literal', value: event.target.value };
            commit();
          }
        })
      : (choices.length > 1
          ? select(
              choices.map((choice, i) => ({ value: String(i), label: tt(choice.key) })),
              String(activeFormatChoice(segment)),
              value => {
                segment.format = { ...segment.format, ...choices[Number(value)].patch };
                commit();
              }
            )
          : el('span', { class: 'row__group', text: (segment.format || {}).type || 'text' }));

    const labelInput = el('input', {
      class: 'row__label',
      type: 'text',
      maxlength: '18',
      value: segment.showLabel ? (segment.label || '') : '',
      placeholder: block ? '—' : (catalogueLabel || tt('row.labelPlaceholder')),
      'aria-label': tt('row.labelAria', { id: segment.id }),
      oninput: event => {
        const text = event.target.value;
        segment.showLabel = text.length > 0;
        segment.label = text || catalogueLabel;
        commit();
      }
    });
    if (block) labelInput.disabled = true;

    const name = el('div', {
      class: 'row__name',
      tabindex: '0',
      'data-help': helpText(segment, lang())
    }, [
      el('span', { class: 'row__id', text: segment.id }),
      el('span', { class: 'row__group', text: block ? tt('group.block') : tt('group.' + segment.group) })
    ]);
    attachTip(name, segment);

    const row = el('div', { class: 'row', draggable: 'true' }, [
      el('span', { class: 'row__grip', text: '⠿', 'aria-hidden': 'true' }),
      name,

      el('input', {
        class: 'row__emoji',
        type: 'text',
        maxlength: '4',
        value: segment.emoji || '',
        placeholder: '–',
        'aria-label': tt('row.emojiAria', { id: segment.id }),
        oninput: event => {
          segment.emoji = event.target.value;
          segment.showEmoji = event.target.value.length > 0;
          commit();
        }
      }),

      contentCell,

      select(
        COLOR_CHOICES.map(choice => ({ value: choice.id, label: tt(choice.key) })),
        colorId,
        value => {
          segment.color = colorFor(value, segment);
          swatch.hidden = value !== 'static';
          if (value === 'static') swatch.value = segment.color.value;
          commit();
        }
      ),

      select(
        Array.from({ length: state.lineCount }, (_, i) => ({ value: String(i), label: tt('row.line', { n: i + 1 }) })),
        String(Math.min(segment.line || 0, state.lineCount - 1)),
        value => {
          segment.line = Number(value);
          commit();
        }
      ),

      swatch,
      labelInput,

      el('div', { class: 'row__toggle' }, [
        el('button', {
          class: 'icon-btn', type: 'button', title: tt('row.up'),
          onclick: () => move(index, index - 1)
        }, [el('span', { text: '↑' })]),
        el('button', {
          class: 'icon-btn', type: 'button', title: tt('row.down'),
          onclick: () => move(index, index + 1)
        }, [el('span', { text: '↓' })]),
        el('button', {
          class: 'icon-btn icon-btn--danger', type: 'button', title: tt('row.remove'),
          onclick: () => {
            patch({ segments: getState().segments.filter((_, i) => i !== index), sort: 'manual' });
            rebuild();
          }
        }, [el('span', { text: '✕' })])
      ])
    ]);

    row.addEventListener('dragstart', event => {
      event.dataTransfer.setData('text/plain', String(index));
      event.dataTransfer.effectAllowed = 'move';
      row.classList.add('row--dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('row--dragging'));
    row.addEventListener('dragover', event => {
      event.preventDefault();
      row.classList.add('row--over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('row--over'));
    row.addEventListener('drop', event => {
      event.preventDefault();
      row.classList.remove('row--over');
      const from = Number(event.dataTransfer.getData('text/plain'));
      if (Number.isFinite(from) && from !== index) move(from, index);
    });

    dom.rows.appendChild(row);
  });
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
}
</script>
