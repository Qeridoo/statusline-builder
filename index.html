<title>Claude Code Statusline Builder</title>
<style>
/* Light is the base palette. Dark redefines only tokens, in both the
   un-stamped (prefers-color-scheme) and the explicitly stamped state. */
:root {
  --ground: #f4f3f7;
  --surface: #ffffff;
  --surface-2: #eceaf1;
  --line: #dcd9e4;
  --line-strong: #c3bfd0;
  --ink: #1a1922;
  --ink-2: #4a4757;
  --muted: #6f6b80;
  --accent: #6d3fe0;
  --accent-soft: #ede7fd;
  --accent-ink: #ffffff;
  --term-bg: #16151d;
  --term-ink: #d8d5e4;
  --danger: #b3261e;
  --warn: #a06a12;

  --radius: 8px;
  --gap: 14px;
  --font-ui: "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "Cascadia Code", "Cascadia Mono", ui-monospace, Consolas, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #131219;
    --surface: #1b1a23;
    --surface-2: #232230;
    --line: #302e3d;
    --line-strong: #45425a;
    --ink: #e7e4f0;
    --ink-2: #b6b2c6;
    --muted: #8b869c;
    --accent: #a882ff;
    --accent-soft: #2a2140;
    --accent-ink: #16121f;
    --term-bg: #0e0d14;
    --term-ink: #d8d5e4;
    --danger: #f2837c;
    --warn: #e0a83f;
  }
}

:root[data-theme="dark"] {
  --ground: #131219;
  --surface: #1b1a23;
  --surface-2: #232230;
  --line: #302e3d;
  --line-strong: #45425a;
  --ink: #e7e4f0;
  --ink-2: #b6b2c6;
  --muted: #8b869c;
  --accent: #a882ff;
  --accent-soft: #2a2140;
  --accent-ink: #16121f;
  --term-bg: #0e0d14;
  --term-ink: #d8d5e4;
  --danger: #f2837c;
  --warn: #e0a83f;
}

* { box-sizing: border-box; }

/* Author display rules beat the UA stylesheet, so [hidden] needs saying twice. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; text-wrap: balance; }

button, select, input, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- proof bar ---------- */

.proof {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.proof__inner {
  max-width: 1680px;
  margin: 0 auto;
  padding: 14px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.proof__head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.proof__title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.proof__sub {
  color: var(--muted);
  font-size: 12.5px;
}

.proof__spacer { flex: 1 1 auto; }

.terminal {
  background: var(--term-bg);
  color: var(--term-ink);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  padding: 13px 16px;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.75;
  overflow-x: auto;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.terminal:empty::before {
  content: "Kein Segment aktiv — links etwas auswählen.";
  color: #6b6880;
}

.sl-sep { color: #5d5a71; }

/* ---------- toolbar ---------- */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
}

.field {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.field > span { white-space: nowrap; }

.slider {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
}

.slider input[type="range"] { width: 96px; accent-color: var(--accent); }

.slider output {
  font-family: var(--font-mono);
  font-size: 11.5px;
  min-width: 34px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

/* ---------- layout ---------- */

.shell {
  max-width: 1680px;
  margin: 0 auto;
  padding: 18px 20px 56px;
  display: grid;
  grid-template-columns: 264px minmax(0, 1fr) 400px;
  gap: var(--gap);
  align-items: start;
}

@media (max-width: 1240px) {
  .shell { grid-template-columns: 240px minmax(0, 1fr); }
  .panel--export { grid-column: 1 / -1; }
}

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .panel--export { grid-column: auto; }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel__head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}

.panel__title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.panel__spacer { flex: 1 1 auto; }

.panel__body { padding: 12px 14px 16px; }

.panel--catalog .panel__body {
  max-height: calc(100vh - 260px);
  overflow-y: auto;
}

/* ---------- catalogue ---------- */

.group + .group { margin-top: 16px; }

.group__head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}

.group__list { display: flex; flex-wrap: wrap; gap: 5px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-2);
  font-size: 12.5px;
  cursor: pointer;
  transition: background-color .12s, border-color .12s, color .12s;
}

.chip:hover { border-color: var(--accent); color: var(--ink); }

.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.chip__emoji { font-size: 12px; }

/* ---------- builder ---------- */

.rows { display: flex; flex-direction: column; gap: 7px; }

.row {
  display: grid;
  grid-template-columns: auto minmax(96px, 1fr) auto minmax(88px, 1fr) minmax(88px, 1fr) minmax(72px, .7fr) auto minmax(84px, .9fr) auto;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
}

.row--dragging { opacity: .45; }
.row--over { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.row__grip {
  cursor: grab;
  color: var(--muted);
  padding: 0 2px;
  font-size: 14px;
  line-height: 1;
  user-select: none;
}

.row__name {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.row__id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row__group {
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

.row__emoji {
  width: 46px;
  text-align: center;
  padding: 4px 2px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
}

.row select,
.control select,
.control input[type="text"],
.control input[type="number"] {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  font-size: 12px;
}

.row__swatch {
  width: 26px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: none;
  cursor: pointer;
}

.row__toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.icon-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  border-radius: 5px;
  padding: 2px 6px;
  line-height: 1.2;
}

.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn--danger:hover { color: var(--danger); }

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 18px 4px;
  text-align: center;
}

/* ---------- export ---------- */

.tabs { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; }

.tab {
  white-space: nowrap;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
}

.tab:hover { color: var(--ink); }

.tab[aria-selected="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

.code {
  width: 100%;
  min-height: 300px;
  max-height: 46vh;
  resize: vertical;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.6;
  tab-size: 2;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink);
  white-space: pre;
  overflow: auto;
}

.actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

.btn {
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  color: var(--ink);
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 12.5px;
  cursor: pointer;
}

.btn:hover { border-color: var(--accent); }

.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

.hint {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
}

.hint code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--surface-2);
  padding: 1px 4px;
  border-radius: 3px;
}

.install {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- per-line separators ---------- */

.seps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }

.sep-field {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.sep-field input {
  width: 76px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
}

/* ---------- load panel ---------- */

.btn--small { padding: 3px 9px; font-size: 12px; }

.load-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.load-controls input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.load-controls label.btn { cursor: pointer; }

.install__path { flex-direction: column; align-items: stretch; gap: 5px; }

.code--short { min-height: 88px; }

.row__label {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  font-size: 12px;
  min-width: 0;
}

.row__label:disabled { opacity: .35; cursor: not-allowed; }

.row__block {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 6px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--surface-2);
  width: 100%;
}

.code--line { min-height: 54px; }

.install__btn { align-self: flex-start; }

.install .hint b { color: var(--ink-2); font-weight: 700; }

/* ---------- install block ---------- */

.install__top { display: flex; align-items: center; gap: 8px; }

.os-switch {
  display: inline-flex;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  overflow: hidden;
}

.os,
.lang {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 3px 11px;
  font-size: 12px;
  cursor: pointer;
}

.os + .os,
.lang { border-left: 1px solid var(--line); }
.os:hover { color: var(--ink); }

.os[aria-pressed="true"],
.lang[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

.hint--warn {
  border-left: 2px solid var(--warn);
  padding-left: 10px;
  color: var(--ink-2);
}

/* ---------- tooltip ---------- */

.tip {
  position: fixed;
  z-index: 60;
  max-width: 268px;
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 6px 22px rgba(0, 0, 0, .28);
  pointer-events: none;
  font-size: 12px;
  line-height: 1.45;
}

.tip__title {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 3px;
}

.tip__body { color: var(--ink-2); }

.tip__src {
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  word-break: break-all;
}

.row__name { cursor: help; border-radius: 4px; }

/* ---------- cheat sheet ---------- */

.cheat { display: flex; flex-direction: column; gap: 10px; }

.cheat__frame {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--term-bg);
  padding: 8px;
  overflow-x: auto;
}

.cheat__frame svg { display: block; max-width: 100%; height: auto; }

.lang-switch .lang { font-size: 11px; letter-spacing: .04em; font-weight: 600; }
</style>

<header class="proof">
  <div class="proof__inner">
    <div class="proof__head">
      <h1 class="proof__title">Statusline Builder</h1>
      <span class="proof__sub" data-i18n="app.subtitle">Claude Code · payload schema 2.1.227</span>
      <span class="proof__spacer"></span>
      <div class="os-switch lang-switch" role="group" aria-label="Language">
        <button class="lang" type="button" data-lang="en">EN</button>
        <button class="lang" type="button" data-lang="de">DE</button>
      </div>
      <label class="field">
        <span data-i18n="field.lines">Lines</span>
        <select id="line-count">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label class="field">
        <input type="checkbox" id="dim-separator" />
        <span data-i18n="field.dim">Dim separator</span>
      </label>
    </div>

    <div class="terminal" id="preview" aria-live="polite" data-i18n-aria="preview.aria" aria-label="Status line preview"></div>

    <div class="toolbar">
      <div class="seps" id="separators"></div>
      <span class="proof__spacer"></span>
      <label class="slider">
        <span data-i18n="slider.context">Context</span>
        <input type="range" id="pv-ctx" min="0" max="100" step="1" />
        <output id="pv-ctx-out"></output>
      </label>
      <label class="slider">
        <span>5h</span>
        <input type="range" id="pv-5h" min="0" max="100" step="1" />
        <output id="pv-5h-out"></output>
      </label>
      <label class="slider">
        <span>7d</span>
        <input type="range" id="pv-7d" min="0" max="100" step="1" />
        <output id="pv-7d-out"></output>
      </label>
      <span class="slider" id="derived-readout"></span>
    </div>
  </div>
</header>

<datalist id="sep-presets">
  <option value=" | "></option>
  <option value=" · "></option>
  <option value=" ▸ "></option>
  <option value=" • "></option>
  <option value=" ┃ "></option>
  <option value="   "></option>
</datalist>

<main class="shell">
  <section class="panel panel--catalog">
    <div class="panel__head">
      <h2 class="panel__title" data-i18n="panel.segments">Segments</h2>
      <span class="panel__spacer"></span>
      <button class="icon-btn" id="clear-all" type="button" data-i18n="action.clearAll">clear all</button>
    </div>
    <div class="panel__body" id="catalog"></div>
  </section>

  <section class="panel panel--builder">
    <div class="panel__head">
      <h2 class="panel__title" data-i18n="panel.builder">Order &amp; display</h2>
      <span class="panel__spacer"></span>
      <button class="btn btn--small" id="add-block" type="button" data-i18n="action.addBlock">+ Block</button>
      <label class="field">
        <span data-i18n="field.sort">Sort</span>
        <select id="sort">
          <option value="manual" data-i18n="sort.manual">manual</option>
          <option value="reference" data-i18n="sort.reference">reference layout</option>
          <option value="group" data-i18n="sort.group">by group</option>
          <option value="alpha" data-i18n="sort.alpha">alphabetical</option>
        </select>
      </label>
    </div>
    <div class="panel__body">
      <div class="rows" id="rows"></div>
      <p class="hint" id="builder-hint" data-i18n="builder.hint"></p>
    </div>
  </section>

  <section class="panel panel--export">
    <div class="panel__head">
      <h2 class="panel__title" data-i18n="panel.export">Handover</h2>
      <span class="panel__spacer"></span>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-tab="script" data-i18n="tab.script">statusline.js</button>
        <button class="tab" type="button" role="tab" data-tab="prompt" data-i18n="tab.prompt">Prompt</button>
        <button class="tab" type="button" role="tab" data-tab="config" data-i18n="tab.config">Config</button>
        <button class="tab" type="button" role="tab" data-tab="cheat" data-i18n="tab.cheat">Cheat sheet</button>
        <button class="tab" type="button" role="tab" data-tab="load" data-i18n="tab.load">Load</button>
      </div>
    </div>
    <div class="panel__body">
      <div class="load-controls" id="load-controls" hidden>
        <label class="btn" for="load-file" data-i18n="action.chooseFile">Choose file …</label>
        <input type="file" id="load-file" accept=".js,.json,.txt,application/json,text/javascript" />
        <span id="load-file-name" class="hint"></span>
      </div>
      <div class="cheat" id="cheat-panel" hidden>
        <div class="cheat__frame" id="cheat-preview"></div>
        <div class="actions">
          <button class="btn btn--primary" type="button" id="cheat-png" data-i18n="cheat.png">Download PNG</button>
          <button class="btn" type="button" id="cheat-svg" data-i18n="cheat.svg">Download SVG</button>
          <button class="btn" type="button" id="cheat-copy" data-i18n="cheat.copy">Copy SVG</button>
        </div>
      </div>
      <textarea class="code" id="export-out" spellcheck="false" aria-label="Export"></textarea>
      <div class="actions">
        <button class="btn btn--primary" type="button" id="copy" data-i18n="action.copy">Copy</button>
        <button class="btn" type="button" id="download" data-i18n="action.download">Download</button>
        <button class="btn btn--primary" type="button" id="import" hidden data-i18n="action.import">Apply</button>
      </div>
      <p class="hint" id="export-hint"></p>

      <div class="install">
        <div class="install__top">
          <h3 class="panel__title" data-i18n="install.title">Install</h3>
          <span class="panel__spacer"></span>
          <div class="os-switch" role="group" aria-label="Operating system">
            <button class="os" type="button" data-os="windows">Windows</button>
            <button class="os" type="button" data-os="macos">macOS</button>
            <button class="os" type="button" data-os="linux">Linux</button>
          </div>
        </div>

        <label class="field control install__path">
          <span data-i18n="install.path">Target path</span>
          <input type="text" id="install-path" spellcheck="false" />
        </label>

        <p class="hint" data-i18n-html="install.step1"></p>
        <button class="btn btn--primary install__btn" type="button" id="copy-script" data-i18n="install.copyScript">Copy script</button>

        <p class="hint"><span data-i18n-html="install.step2"></span> <span id="shell-name">PowerShell</span>:</p>
        <textarea class="code code--line" id="install-command" spellcheck="false" readonly aria-label="Command"></textarea>
        <button class="btn btn--small install__btn" type="button" id="copy-command" data-i18n="install.copyCommand">Copy command</button>

        <p class="hint" data-i18n-html="install.step3"></p>
        <textarea class="code code--short" id="settings-snippet" spellcheck="false" readonly aria-label="settings.json snippet"></textarea>
        <p class="hint hint--warn" data-i18n-html="install.warn"></p>

        <p class="hint" data-i18n-html="install.step4"></p>
        <textarea class="code code--line" id="verify-command" spellcheck="false" readonly aria-label="Verify command"></textarea>

// Value formatters shared by the builder preview and the generated status line.
// Every formatter returns null for input it cannot represent, so callers can
// drop the segment instead of printing a blank slot.

function parseResetsAt(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number' && Number.isFinite(v)) {
    // Below 1e11 the value cannot plausibly be milliseconds since the epoch.
    return v < 1e11 ? Math.round(v * 1000) : Math.round(v);
  }
  if (typeof v === 'string') {
    const trimmed = v.trim();
    if (/^\d+$/.test(trimmed)) return parseResetsAt(Number(trimmed));
    const parsed = Date.parse(trimmed);
    return Number.isNaN(parsed) ? null : parsed;
  }
  return null;
}

function fmtPercent(n, opts = {}) {
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  const { decimals = 0, sign = false } = opts;
  const prefix = sign && v > 0 ? '+' : '';
  return prefix + v.toFixed(decimals) + '%';
}

function fmtNumber(n, opts = {}) {
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  if (opts.abbrev === false) return String(Math.round(v));
  const abs = Math.abs(v);
  const [divisor, suffix] = abs >= 1e6 ? [1e6, 'M'] : abs >= 1e3 ? [1e3, 'k'] : [1, ''];
  const scaled = v / divisor;
  const decimals = suffix && Math.abs(scaled) < 10 ? 1 : 0;
  return scaled.toFixed(decimals) + suffix;
}

function fmtDuration(ms) {
  const v = Number(ms);
  if (!Number.isFinite(v) || v < 0) return null;
  const totalMinutes = Math.floor(v / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  if (days > 0) return days + 'd' + hours + 'h';
  if (hours > 0) return hours + 'h' + String(minutes).padStart(2, '0') + 'm';
  return minutes + 'm';
}

// Takes milliseconds. Callers run parseResetsAt first.
function fmtCountdown(resetsAtMs, nowMs) {
  const target = Number(resetsAtMs);
  const now = Number(nowMs);
  if (!Number.isFinite(target) || !Number.isFinite(now)) return null;
  return target - now <= 0 ? 'now' : fmtDuration(target - now);
}

function fmtCurrency(usd) {
  const v = Number(usd);
  return Number.isFinite(v) ? '$' + v.toFixed(2) : null;
}

function fmtPath(p, opts = {}) {
  if (typeof p !== 'string' || p === '') return null;
  const { mode = 'basename' } = opts;
  if (mode === 'full') return p;
  const normalised = p.replace(/\\/g, '/').replace(/\/+$/, '');
  if (mode === 'tilde') {
    return normalised.replace(/^(?:[A-Za-z]:)?\/(?:Users|home)\/[^/]+/, '~');
  }
  const parts = normalised.split('/').filter(Boolean);
  if (!parts.length) return normalised;
  if (mode === 'last2') return parts.slice(-2).join('/');
  return parts[parts.length - 1];
}

function fmtText(s, opts = {}) {
  if (s === null || s === undefined) return null;
  const str = String(s);
  const max = Number(opts.max) || 0;
  if (!max || str.length <= max) return str;
  return str.slice(0, max - 1) + '…';
}

function fmtBool(v, opts = {}) {
  if (v === null || v === undefined) return null;
  const { onLabel = 'on', offLabel = '', hideWhenFalse = true } = opts;
  if (!v) return hideWhenFalse ? null : offLabel;
  return onLabel;
}

// ---------- src/derive.js ----------
// Metrics that are not present in the payload and have to be computed from the
// weekly rate-limit bucket. All of them return null when the bucket is absent.


const WINDOW_MS = 7 * 24 * 3600 * 1000;

function weeklyWindow(payload, now) {
  const bucket = payload && payload.rate_limits && payload.rate_limits.seven_day;
  if (!bucket) return null;
  const resetsAt = parseResetsAt(bucket.resets_at);
  const used = Number(bucket.used_percentage);
  if (resetsAt === null || !Number.isFinite(used)) return null;
  const start = resetsAt - WINDOW_MS;
  const elapsedFraction = Math.min(1, Math.max(0, (now - start) / WINDOW_MS));
  // Floor at one hour so pace never divides by zero right before the reset.
  const daysLeft = Math.max((resetsAt - now) / 86400000, 1 / 24);
  return { used, resetsAt, elapsedFraction, daysLeft };
}

// Signed percentage points away from a perfectly even burn.
// Negative means under the line, positive means ahead of it.
function evenBurn(payload, now) {
  const w = weeklyWindow(payload, now);
  return w ? w.used - w.elapsedFraction * 100 : null;
}

// Percent of the weekly allowance that can be spent per day from now on.
function pace(payload, now) {
  const w = weeklyWindow(payload, now);
  return w ? (100 - w.used) / w.daysLeft : null;
}

// Percent of today's slice still available. Capped at a full slice, but allowed
// to go negative: below zero means today is eating into tomorrow.
//
// This is stateless and therefore an approximation. It assumes usage before
// today tracked the even-burn line, because the payload carries no history.
function todayLeft(payload, now) {
  const w = weeklyWindow(payload, now);
  if (!w) return null;
  const slice = 100 / 7;
  const dayIndex = Math.floor(w.elapsedFraction * 7);
  const usedToday = w.used - dayIndex * slice;
  return Math.min(100, ((slice - usedToday) / slice) * 100);
}

// The worst of the three meters, so a single emoji can stand in for all of them.
function worstMeter(payload) {
  const candidates = [
    payload && payload.context_window && payload.context_window.used_percentage,
    payload && payload.rate_limits && payload.rate_limits.five_hour && payload.rate_limits.five_hour.used_percentage,
    payload && payload.rate_limits && payload.rate_limits.seven_day && payload.rate_limits.seven_day.used_percentage
  ].map(Number).filter(Number.isFinite);
  return candidates.length ? Math.max(...candidates) : null;
}

function mood(payload) {
  return worstMeter(payload);
}

// Colour resolution and ANSI wrapping. Truecolor throughout — every terminal
// Claude Code runs in supports it.

const ESC = String.fromCharCode(27);

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex === null || hex === undefined ? '' : hex).trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(rgb) {
  const channel = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return '#' + rgb.map(channel).join('');
}

function resolveColor(spec, value) {
  if (!spec || typeof spec !== 'object') return null;
  if (spec.mode === 'static') return spec.value || null;

  const v = Number(value);

  if (spec.mode === 'threshold') {

    if (!Number.isFinite(v)) return stops[0][1];

    for (const [at, hex] of stops) if (v >= at) picked = hex;
    return picked;
  }

    const from = hexToRgb(spec.from);
    const to = hexToRgb(spec.to);
    if (!from || !to) return null;

    const max = Number(spec.max === undefined ? 100 : spec.max);
    const t = max === min ? 0 : Math.min(1, Math.max(0, (v - min) / (max - min)));
    return rgbToHex(from.map((c, i) => c + (to[i] - c) * t));
  }

  return null;
}

function hexToAnsi(hex) {
  const rgb = hexToRgb(hex);
  return rgb ? '38;2;' + rgb.join(';') : null;
}

function ansiWrap(text, hex, opts = {}) {
  const codes = [];
  if (opts.bold) codes.push('1');
  if (opts.dim) codes.push('2');
  const colour = hexToAnsi(hex);
  if (colour) codes.push(colour);
  if (!codes.length) return text;
  return ESC + '[' + codes.join(';') + 'm' + text + ESC + '[0m';
}

function getPath(obj, path) {
  if (!obj || !path) return null;
  let cur = obj;
  for (const key of path.split('.')) {
    if (cur === null || cur === undefined || typeof cur !== 'object') return null;
    cur = cur[key];
  }
  return cur === undefined ? null : cur;
}

function applyFormat(raw, format, now) {
  const f = format || {};
  const type = f.type || 'text';
  let out = null;

  switch (type) {
    case 'raw':
      out = raw === null || raw === undefined ? null : String(raw);
      break;
    case 'path':
      out = fmtPath(raw, { mode: f.mode || 'basename' });
      break;
    case 'percent':
      out = fmtPercent(raw, f);
      break;
    case 'number':
      out = fmtNumber(raw, f);
      break;
    case 'duration':
      out = fmtDuration(raw);
      break;
    case 'countdown':
      out = fmtCountdown(parseResetsAt(raw), now);
      break;
    case 'currency':
      out = fmtCurrency(raw);
      break;
    case 'bool':
      out = fmtBool(raw, f);
      break;
    case 'count': {
      const n = Array.isArray(raw) ? raw.length : Number(raw);
      out = Number.isFinite(n) && n > 0 ? String(n) : null;
      break;
    }
    case 'arrow': {
      const v = Number(raw);
      if (!Number.isFinite(v)) break;
      const arrow = v < -0.5 ? '▼' : v > 0.5 ? '▲' : '▬';
      out = arrow + Math.abs(v).toFixed(f.decimals || 0);
      break;
    }
    case 'emojiScale': {
      const v = Number(raw);
      if (!Number.isFinite(v)) break;
      const stops = (f.stops || MOOD_STOPS).slice().sort((a, b) => a[0] - b[0]);
      out = stops[0][1];
      for (const [at, emoji] of stops) if (v >= at) out = emoji;
      break;
    }
    default: {
      let s = raw === null || raw === undefined ? null : String(raw);
      if (s !== null && f.slice) s = s.slice(0, f.slice);
      out = s === null ? null : fmtText(s, { max: f.max });
    }
  }

  if (out === null || out === undefined || out === '') return null;
  if (f.prefix) out = f.prefix + out;
  if (f.suffix) out = out + f.suffix;
  return out;
}

function getValue(segment, payload, now) {
  if (!segment || !segment.source) return null;
  const at = now === undefined ? Date.now() : now;

  try {
    if (segment.source.kind === 'literal') {
      raw = segment.source.value;
    } else if (segment.source.kind === 'derived') {
      const fn = DERIVED[segment.source.fn];
      raw = fn ? fn(payload, at) : null;
    } else {
      raw = getPath(payload, segment.source.path);
    }
  } catch {
    return null;
  }

  if (raw === null || raw === undefined) return null;
  if (segment.hideValues && segment.hideValues.indexOf(String(raw)) !== -1) return null;

  const display = applyFormat(raw, segment.format, at);
  if (display === null) return null;

  let colorValue = Number(raw);
  if (!Number.isFinite(colorValue)) {
    const scale = segment.scaleMap;
    colorValue = scale && scale[String(raw)] !== undefined ? scale[String(raw)] : null;
  }
  return { raw, display, colorValue };
}

// Turns a config plus a payload into either terminal output or preview markup.
// Both renderers share buildLines so the preview cannot drift from the real thing.


const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const escapeHtml = s => String(s).replace(/[&<>"]/g, c => HTML_ESCAPES[c]);

// Config can arrive from an imported JSON file, so a colour is only ever
// interpolated into markup after it has been checked.
const safeHex = hex => (/^#[0-9a-f]{6}$/i.test(String(hex)) ? String(hex) : null);

const DEFAULT_SEPARATOR = ' | ';

// Each line carries its own separator; config.separator is the fallback for
// lines that were never given one, and for configs written before per-line
// separators existed.
function separatorFor(config, index) {
  const perLine = config.separators;
  if (Array.isArray(perLine) && typeof perLine[index] === 'string') return perLine[index];
  return config.separator === undefined ? DEFAULT_SEPARATOR : config.separator;
}

function segmentText(segment, value) {
  const pieces = [];
  if (segment.showEmoji !== false && segment.emoji) pieces.push(segment.emoji);
  if (segment.showLabel && segment.label) pieces.push(segment.label + ':');
  pieces.push(value.display);
  return pieces.join(' ');
}

// Returns one entry per non-empty line, keeping the original line index so the
// caller can look up that line's separator.
function buildLines(config, payload, now) {
  const lineCount = Math.max(1, Math.min(3, Number(config.lineCount) || 1));
  const lines = [];
  for (let i = 0; i < lineCount; i++) lines.push({ line: i, parts: [] });

  for (const segment of config.segments || []) {
    const value = getValue(segment, payload, now);
    if (!value) continue;
    const index = Math.min(lineCount - 1, Math.max(0, Number(segment.line) || 0));
    lines[index].parts.push({
      segment,
      value,
      text: segmentText(segment, value),
      hex: safeHex(resolveColor(segment.color, value.colorValue))
    });
  }
  return lines.filter(entry => entry.parts.length > 0);
}

function renderAnsi(config, payload, now) {
  const at = now === undefined ? Date.now() : now;
  return buildLines(config, payload, at)
    .map(entry => {
      const joiner = ansiWrap(separatorFor(config, entry.line), null, { dim: config.dimSeparator !== false });
      return entry.parts
        .map(p => ansiWrap(p.text, p.hex, { bold: p.segment.bold, dim: p.segment.dim }))
        .join(joiner);
    })
    .join('\n');
}

function renderHtml(config, payload, now) {
  const at = now === undefined ? Date.now() : now;
  return buildLines(config, payload, at)
    .map(entry => {
      const joiner = '<span class="sl-sep">' +
        escapeHtml(separatorFor(config, entry.line)).replace(/ /g, '&nbsp;') + '</span>';
      return entry.parts
        .map(p => {
          const styles = [];
          if (p.hex) styles.push('color:' + p.hex);
          if (p.segment.bold) styles.push('font-weight:700');
          if (p.segment.dim) styles.push('opacity:.6');
          const attr = styles.length ? ' style="' + styles.join(';') + '"' : '';
          return '<span class="sl-seg"' + attr + '>' + escapeHtml(p.text) + '</span>';
        })
        .join(joiner);
    })
    .join('<br>');
}

// ---------- src/cheatsheet.js ----------
// Builds the annotated cheat sheet: the rendered status line with a labelled
// callout per segment, as a standalone SVG.
//
// Text measurement is injected rather than done here, so the layout is a pure
// function the tests can drive with a predictable monospace model while the
// browser passes a real canvas measurer.


const REPO_URL = 'github.com/Qeridoo/statusline-builder';

const XML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' };
const escapeXml = s => String(s).replace(/[&<>"']/g, c => XML_ESCAPES[c]);

const THEME = {
  bg: '#14131a',
  panel: '#1b1a23',
  ink: '#e7e4f0',
  muted: '#8b869c',
  faint: '#3a3747',
  accent: '#a882ff',
  separator: '#5d5a71'
};

const LAYOUT = {
  pad: 44,
  titleSize: 19,
  lineSize: 17,
  calloutTitleSize: 9.5,
  calloutBodySize: 9.5,
  calloutLineHeight: 12,
  rowGap: 14,
  leader: 16,
  labelWrap: 30,
  minGap: 16
};

function wrapText(text, maxChars) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const word of words) {
    if (!line) line = word;
    else if ((line + ' ' + word).length <= maxChars) line += ' ' + word;
    else { lines.push(line); line = word; }
  }
  if (line) lines.push(line);
  return lines;
}

// Alternates callouts above and below the line, then packs each side into as
// few rows as fit without two labels overlapping.
function assignSlots(callouts, minGap = LAYOUT.minGap) {
  const ordered = callouts.slice().sort((a, b) => a.anchor - b.anchor);
  const sides = { top: [], bottom: [] };
  ordered.forEach((callout, index) => {
    callout.side = index % 2 === 0 ? 'top' : 'bottom';
    sides[callout.side].push(callout);
  });

  for (const side of ['top', 'bottom']) {
    const rightmost = [];
    for (const callout of sides[side]) {
      const left = callout.anchor - callout.width / 2;
      let row = 0;
      while (rightmost[row] !== undefined && rightmost[row] + minGap > left) row += 1;
      rightmost[row] = left + callout.width;
      callout.row = row;
      callout.left = left;
    }
  }

  return {
    callouts: ordered,
    topRows: sides.top.reduce((max, c) => Math.max(max, c.row + 1), 0),
    bottomRows: sides.bottom.reduce((max, c) => Math.max(max, c.row + 1), 0)
  };
}

// Everything positional, separated from the markup so the geometry can be
// asserted directly — in particular that no callout runs off the canvas.
// measure(text, fontSize, family) -> width in px. family is 'mono' or 'sans'.
function cheatsheetGeometry(config, payload, measure, opts = {}) {
  const now = opts.now === undefined ? Date.now() : opts.now;
  const lines = buildLines(config, payload, now);

  const mono = text => measure(text, LAYOUT.lineSize, 'mono');
  const sansTitle = text => measure(text, LAYOUT.calloutTitleSize, 'sans');
  const sansBody = text => measure(text, LAYOUT.calloutBodySize, 'sans');

  // Lay out every status line row, remembering where each segment sits.
  const rendered = lines.map(entry => {
    const separator = separatorOf(config, entry.line);
    const separatorWidth = mono(separator);
    const parts = [];
    let x = 0;
    entry.parts.forEach((part, index) => {
      if (index > 0) {
        parts.push({ text: separator, x, width: separatorWidth, hex: THEME.separator, isSeparator: true });
        x += separatorWidth;
      }
      const width = mono(part.text);
      parts.push({ text: part.text, x, width, hex: part.hex || THEME.ink, segment: part.segment });
      x += width;
    });
    return { parts, width: x };
  });

  const lineWidth = rendered.reduce((max, row) => Math.max(max, row.width), 0);

  // Only the first row gets callouts; a second status line would double the
  // height for little gain, and its segments are listed in the legend anyway.
  const primary = rendered[0] || { parts: [], width: 0 };
  const callouts = primary.parts
    .filter(part => part.segment && helpText(part.segment, lang()))
    .map(part => {
      const label = String(part.segment.label || part.segment.id).toUpperCase();
      const body = wrapText(helpText(part.segment, lang()), LAYOUT.labelWrap);
      const width = Math.max(sansTitle(label), ...body.map(sansBody), 40);
      return { label, body, width, anchor: part.x + part.width / 2, hex: part.hex };
    });

  const slots = assignSlots(callouts);
  const bodyLines = Math.max(1, ...callouts.map(c => c.body.length));
  const blockHeight = LAYOUT.calloutLineHeight * (bodyLines + 1) + LAYOUT.rowGap;

  const topBlock = slots.topRows * blockHeight;
  const bottomBlock = slots.bottomRows * blockHeight;
  const headerH = LAYOUT.titleSize + 26;
  const statusRowHeight = LAYOUT.lineSize * 1.75;
  const statusH = rendered.length * statusRowHeight;
  const footerH = 30;

  // A callout is centred on its segment, so the outermost ones stick out past
  // the status line itself. The canvas has to cover them, not just the line.
  const contentLeft = Math.min(0, ...callouts.map(c => c.anchor - c.width / 2));
  const contentRight = Math.max(lineWidth, ...callouts.map(c => c.anchor + c.width / 2));
  const contentWidth = contentRight - contentLeft;

  const width = Math.round(Math.max(940, contentWidth + LAYOUT.pad * 2));
  const height = Math.round(LAYOUT.pad + headerH + topBlock + LAYOUT.leader + statusH +
    LAYOUT.leader + bottomBlock + footerH + LAYOUT.pad);

  const originX = Math.round((width - contentWidth) / 2 - contentLeft);
  const firstBaseline = LAYOUT.pad + headerH + topBlock + LAYOUT.leader + LAYOUT.lineSize;

  return {
    rendered, callouts: slots.callouts, width, height, originX, firstBaseline,
    blockHeight, topBlock, headerH, statusRowHeight, bodyLines,
    topRows: slots.topRows, bottomRows: slots.bottomRows
  };
}

function buildCheatsheetSvg(config, payload, measure, opts = {}) {
  const title = opts.title || tt('cheat.title');
  const repo = opts.repo || REPO_URL;
  const {
    rendered, callouts, width, height, originX, firstBaseline,
    blockHeight, topBlock, headerH, statusRowHeight
  } = cheatsheetGeometry(config, payload, measure, opts);

  const out = [];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height +
    '" viewBox="0 0 ' + width + ' ' + height + '" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif">');
  out.push('<rect width="100%" height="100%" fill="' + THEME.bg + '"/>');
  out.push('<rect x="16" y="16" width="' + (width - 32) + '" height="' + (height - 32) +
    '" rx="14" fill="' + THEME.panel + '" stroke="' + THEME.faint + '"/>');

  out.push('<text x="' + LAYOUT.pad + '" y="' + (LAYOUT.pad + LAYOUT.titleSize) + '" font-size="' + LAYOUT.titleSize +
    '" font-weight="600" fill="' + THEME.ink + '">' + escapeXml(title) + '</text>');

  // Status line rows.
  rendered.forEach((row, index) => {
    const baseline = firstBaseline + index * statusRowHeight;
    out.push('<g font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="' + LAYOUT.lineSize + '">');
    for (const part of row.parts) {
      out.push('<text x="' + round(originX + part.x) + '" y="' + round(baseline) + '" fill="' + part.hex +
        '" xml:space="preserve">' + escapeXml(part.text) + '</text>');
    }
    out.push('</g>');
  });

  // Callouts.
  const lastBaseline = firstBaseline + (rendered.length - 1) * statusRowHeight;
  for (const callout of callouts) {
    const anchorX = round(originX + callout.anchor);
    const isTop = callout.side === 'top';
    const rowOffset = callout.row * blockHeight;

    const labelBottom = isTop
      ? LAYOUT.pad + headerH + topBlock - rowOffset - LAYOUT.rowGap
      : lastBaseline + LAYOUT.leader + rowOffset + LAYOUT.calloutLineHeight;

    const leaderFrom = isTop
      ? labelBottom + 4
      : lastBaseline + 6;
    const leaderTo = isTop
      ? firstBaseline - LAYOUT.lineSize - 4
      : labelBottom - LAYOUT.calloutLineHeight - 4;

    out.push('<line x1="' + anchorX + '" y1="' + round(leaderFrom) + '" x2="' + anchorX + '" y2="' +
      round(leaderTo) + '" stroke="' + THEME.faint + '" stroke-width="1"/>');

    const titleY = isTop ? labelBottom - LAYOUT.calloutLineHeight * callout.body.length : labelBottom;
    out.push('<text x="' + anchorX + '" y="' + round(titleY) + '" text-anchor="middle" font-size="' +
      LAYOUT.calloutTitleSize + '" font-weight="700" letter-spacing="0.9" fill="' + (callout.hex || THEME.ink) +
      '">' + escapeXml(callout.label) + '</text>');

    callout.body.forEach((text, index) => {
      const y = titleY + LAYOUT.calloutLineHeight * (index + 1);
      out.push('<text x="' + anchorX + '" y="' + round(y) + '" text-anchor="middle" font-size="' +
        LAYOUT.calloutBodySize + '" fill="' + THEME.muted + '">' + escapeXml(text) + '</text>');
    });
  }

  out.push('<text x="' + LAYOUT.pad + '" y="' + round(height - LAYOUT.pad) + '" font-size="11" fill="' + THEME.muted +
    '" font-family="ui-monospace, Cascadia Code, Consolas, monospace">' + escapeXml(repo) + '</text>');
  out.push('</svg>');
  return out.join('\n');
}

function separatorOf(config, index) {
  const perLine = config.separators;
  if (Array.isArray(perLine) && typeof perLine[index] === 'string') return perLine[index];
  return config.separator === undefined ? ' | ' : config.separator;
}

const round = n => Math.round(n * 10) / 10;

// ---------- src/runtime.js ----------
// The engine that ships inside the generated statusline.js.
//
// It deliberately repeats the logic of format.js, derive.js, color.js and
// render.js instead of importing them: the generated file lives in ~/.claude and
// must stand alone. test/generate.test.js renders the same config through both
// paths and asserts byte equality, so the two cannot drift apart unnoticed.
//
// Constraints for anything written inside this string: no backticks and no
// dollar-brace sequences, because the whole body is a raw template literal.

const RUNTIME_SOURCE = String.raw`
'use strict';

const ESC = String.fromCharCode(27);
const WINDOW_MS = 7 * 24 * 3600 * 1000;
// SL_NOW makes the output reproducible for tests.
const NOW = Number(process.env.SL_NOW) || Date.now();

function parseResetsAt(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number' && Number.isFinite(v)) return v < 1e11 ? Math.round(v * 1000) : Math.round(v);
  if (typeof v === 'string') {
    const trimmed = v.trim();
    if (/^\d+$/.test(trimmed)) return parseResetsAt(Number(trimmed));
    const parsed = Date.parse(trimmed);
    return Number.isNaN(parsed) ? null : parsed;
  }
  return null;
}

function fmtPercent(n, opts) {
  const f = opts || {};
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  const decimals = f.decimals || 0;
  const prefix = f.sign && v > 0 ? '+' : '';
  return prefix + v.toFixed(decimals) + '%';
}

function fmtNumber(n, opts) {
  const f = opts || {};
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  if (f.abbrev === false) return String(Math.round(v));
  const abs = Math.abs(v);
  const divisor = abs >= 1e6 ? 1e6 : abs >= 1e3 ? 1e3 : 1;
  const suffix = abs >= 1e6 ? 'M' : abs >= 1e3 ? 'k' : '';
  const scaled = v / divisor;
  const decimals = suffix && Math.abs(scaled) < 10 ? 1 : 0;
  return scaled.toFixed(decimals) + suffix;
}

function fmtDuration(ms) {
  const v = Number(ms);
  if (!Number.isFinite(v) || v < 0) return null;
  const totalMinutes = Math.floor(v / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  if (days > 0) return days + 'd' + hours + 'h';
  if (hours > 0) return hours + 'h' + String(minutes).padStart(2, '0') + 'm';
  return minutes + 'm';
}

function fmtCountdown(resetsAtMs, nowMs) {
  const target = Number(resetsAtMs);
  const now = Number(nowMs);
  if (!Number.isFinite(target) || !Number.isFinite(now)) return null;
  return target - now <= 0 ? 'now' : fmtDuration(target - now);
}

function fmtCurrency(usd) {
  const v = Number(usd);
  return Number.isFinite(v) ? '$' + v.toFixed(2) : null;
}

function fmtPath(p, opts) {
  const f = opts || {};
  if (typeof p !== 'string' || p === '') return null;
  const mode = f.mode || 'basename';
  if (mode === 'full') return p;
  const normalised = p.replace(/\\/g, '/').replace(/\/+$/, '');
  if (mode === 'tilde') return normalised.replace(/^(?:[A-Za-z]:)?\/(?:Users|home)\/[^/]+/, '~');
  const parts = normalised.split('/').filter(Boolean);
  if (!parts.length) return normalised;
  if (mode === 'last2') return parts.slice(-2).join('/');
  return parts[parts.length - 1];
}

function fmtText(s, opts) {
  const f = opts || {};
  if (s === null || s === undefined) return null;
  const str = String(s);
  const max = Number(f.max) || 0;
  if (!max || str.length <= max) return str;
  return str.slice(0, max - 1) + '…';
}

function fmtBool(v, opts) {
  const f = opts || {};
  if (v === null || v === undefined) return null;
  const hideWhenFalse = f.hideWhenFalse === undefined ? true : f.hideWhenFalse;
  if (!v) return hideWhenFalse ? null : (f.offLabel || '');
  return f.onLabel || 'on';
}

function weeklyWindow(payload) {
  const bucket = payload && payload.rate_limits && payload.rate_limits.seven_day;
  if (!bucket) return null;
  const resetsAt = parseResetsAt(bucket.resets_at);
  const used = Number(bucket.used_percentage);
  if (resetsAt === null || !Number.isFinite(used)) return null;
  const start = resetsAt - WINDOW_MS;
  const elapsedFraction = Math.min(1, Math.max(0, (NOW - start) / WINDOW_MS));
  const daysLeft = Math.max((resetsAt - NOW) / 86400000, 1 / 24);
  return { used: used, resetsAt: resetsAt, elapsedFraction: elapsedFraction, daysLeft: daysLeft };
}

function worstMeter(payload) {
  const out = [];
  const push = v => { const n = Number(v); if (Number.isFinite(n)) out.push(n); };
  push(payload && payload.context_window && payload.context_window.used_percentage);
  push(payload && payload.rate_limits && payload.rate_limits.five_hour && payload.rate_limits.five_hour.used_percentage);
  push(payload && payload.rate_limits && payload.rate_limits.seven_day && payload.rate_limits.seven_day.used_percentage);
  return out.length ? Math.max.apply(null, out) : null;
}

function derivedValue(fn, payload) {
  if (fn === 'evenBurn') {
    const w = weeklyWindow(payload);
    return w ? w.used - w.elapsedFraction * 100 : null;
  }
  if (fn === 'pace') {
    const w = weeklyWindow(payload);
    return w ? (100 - w.used) / w.daysLeft : null;
  }
  if (fn === 'todayLeft') {
    const w = weeklyWindow(payload);
    if (!w) return null;
    const slice = 100 / 7;
    const dayIndex = Math.floor(w.elapsedFraction * 7);
    const usedToday = w.used - dayIndex * slice;
    return Math.min(100, ((slice - usedToday) / slice) * 100);
  }
  if (fn === 'mood') return worstMeter(payload);
  if (fn === 'linesDelta') {
    const added = Number(payload && payload.cost && payload.cost.total_lines_added);
    const removed = Number(payload && payload.cost && payload.cost.total_lines_removed);
    if (!Number.isFinite(added) && !Number.isFinite(removed)) return null;
    return '+' + (Number.isFinite(added) ? added : 0) + '/-' + (Number.isFinite(removed) ? removed : 0);
  }
  if (fn === 'contextLeftTokens') {
    const size = Number(payload && payload.context_window && payload.context_window.context_window_size);
    const pct = Number(payload && payload.context_window && payload.context_window.remaining_percentage);
    if (!Number.isFinite(size) || !Number.isFinite(pct)) return null;
    return (size * pct) / 100;
  }
  return null;
}

function getPath(obj, path) {
  if (!obj || !path) return null;
  let cur = obj;
  const keys = path.split('.');
  for (let i = 0; i < keys.length; i++) {
    if (cur === null || cur === undefined || typeof cur !== 'object') return null;
    cur = cur[keys[i]];
  }
  return cur === undefined ? null : cur;
}

const MOOD_STOPS = [[0, '\u{1F63A}'], [30, '\u{1F63C}'], [50, '\u{1F640}'], [70, '\u{1F63E}']];

function applyFormat(raw, format) {
  const f = format || {};
  const type = f.type || 'text';
  let out = null;

  if (type === 'raw') {
    out = raw === null || raw === undefined ? null : String(raw);
  } else if (type === 'path') {
    out = fmtPath(raw, { mode: f.mode || 'basename' });
  } else if (type === 'percent') {
    out = fmtPercent(raw, f);
  } else if (type === 'number') {
    out = fmtNumber(raw, f);
  } else if (type === 'duration') {
    out = fmtDuration(raw);
  } else if (type === 'countdown') {
    out = fmtCountdown(parseResetsAt(raw), NOW);
  } else if (type === 'currency') {
    out = fmtCurrency(raw);
  } else if (type === 'bool') {
    out = fmtBool(raw, f);
  } else if (type === 'count') {
    const n = Array.isArray(raw) ? raw.length : Number(raw);
    out = Number.isFinite(n) && n > 0 ? String(n) : null;
  } else if (type === 'arrow') {
    const v = Number(raw);
    if (Number.isFinite(v)) {
      const arrow = v < -0.5 ? '▼' : v > 0.5 ? '▲' : '▬';
      out = arrow + Math.abs(v).toFixed(f.decimals || 0);
    }
  } else if (type === 'emojiScale') {
    const v = Number(raw);
    if (Number.isFinite(v)) {
      const stops = (f.stops || MOOD_STOPS).slice().sort((a, b) => a[0] - b[0]);
      out = stops[0][1];
      for (let i = 0; i < stops.length; i++) if (v >= stops[i][0]) out = stops[i][1];
    }
  } else {
    let s = raw === null || raw === undefined ? null : String(raw);
    if (s !== null && f.slice) s = s.slice(0, f.slice);
    out = s === null ? null : fmtText(s, { max: f.max });
  }

  if (out === null || out === undefined || out === '') return null;
  if (f.prefix) out = f.prefix + out;
  if (f.suffix) out = out + f.suffix;
  return out;
}

function getValue(segment, payload) {
  if (!segment || !segment.source) return null;
  let raw = null;
  try {
    if (segment.source.kind === 'literal') raw = segment.source.value;
    else if (segment.source.kind === 'derived') raw = derivedValue(segment.source.fn, payload);
    else raw = getPath(payload, segment.source.path);
  } catch (e) {
    return null;
  }
  if (raw === null || raw === undefined) return null;
  if (segment.hideValues && segment.hideValues.indexOf(String(raw)) !== -1) return null;

  const display = applyFormat(raw, segment.format);
  if (display === null) return null;

  let colorValue = Number(raw);
  if (!Number.isFinite(colorValue)) {
    const scale = segment.scaleMap;
    colorValue = scale && scale[String(raw)] !== undefined ? scale[String(raw)] : null;
  }
  return { raw: raw, display: display, colorValue: colorValue };
}

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex === null || hex === undefined ? '' : hex).trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(rgb) {
  const channel = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return '#' + rgb.map(channel).join('');
}

function resolveColor(spec, value) {
  if (!spec || typeof spec !== 'object') return null;
  if (spec.mode === 'static') return spec.value || null;
  const v = Number(value);
  if (spec.mode === 'threshold') {
    const stops = (spec.stops || []).slice().sort((a, b) => a[0] - b[0]);
    if (!stops.length) return null;
    if (!Number.isFinite(v)) return stops[0][1];
    let picked = stops[0][1];
    for (let i = 0; i < stops.length; i++) if (v >= stops[i][0]) picked = stops[i][1];
    return picked;
  }
  if (spec.mode === 'gradient') {
    const from = hexToRgb(spec.from);
    const to = hexToRgb(spec.to);
    if (!from || !to) return null;
    const min = Number(spec.min === undefined ? 0 : spec.min);
    const max = Number(spec.max === undefined ? 100 : spec.max);
    const t = max === min ? 0 : Math.min(1, Math.max(0, (v - min) / (max - min)));
    return rgbToHex(from.map((c, i) => c + (to[i] - c) * t));
  }
  return null;
}

function hexToAnsi(hex) {
  const rgb = hexToRgb(hex);
  return rgb ? '38;2;' + rgb.join(';') : null;
}

function ansiWrap(text, hex, opts) {
  const o = opts || {};
  const codes = [];
  if (o.bold) codes.push('1');
  if (o.dim) codes.push('2');
  const colour = hexToAnsi(hex);
  if (colour) codes.push(colour);
  if (!codes.length) return text;
  return ESC + '[' + codes.join(';') + 'm' + text + ESC + '[0m';
}

function safeHex(hex) {
  return /^#[0-9a-f]{6}$/i.test(String(hex)) ? String(hex) : null;
}

function segmentText(segment, value) {
  const pieces = [];
  if (segment.showEmoji !== false && segment.emoji) pieces.push(segment.emoji);
  if (segment.showLabel && segment.label) pieces.push(segment.label + ':');
  pieces.push(value.display);
  return pieces.join(' ');
}

function separatorFor(index) {
  const perLine = CFG.separators;
  if (Array.isArray(perLine) && typeof perLine[index] === 'string') return perLine[index];
  return CFG.separator === undefined ? ' | ' : CFG.separator;
}

function render(payload) {
  const lineCount = Math.max(1, Math.min(3, Number(CFG.lineCount) || 1));
  const lines = [];
  for (let i = 0; i < lineCount; i++) lines.push({ line: i, parts: [] });

  const segments = CFG.segments || [];
  for (let i = 0; i < segments.length; i++) {
    const segment = segments[i];
    const value = getValue(segment, payload);
    if (!value) continue;
    const index = Math.min(lineCount - 1, Math.max(0, Number(segment.line) || 0));
    lines[index].parts.push({
      segment: segment,
      text: segmentText(segment, value),
      hex: safeHex(resolveColor(segment.color, value.colorValue))
    });
  }

  return lines
    .filter(entry => entry.parts.length > 0)
    .map(entry => {
      const joiner = ansiWrap(separatorFor(entry.line), null, { dim: CFG.dimSeparator !== false });
      return entry.parts
        .map(p => ansiWrap(p.text, p.hex, { bold: p.segment.bold, dim: p.segment.dim }))
        .join(joiner);
    })
    .join('\n');
}

function fallback(payload) {
  const model = getPath(payload, 'model.display_name');
  const dir = fmtPath(getPath(payload, 'workspace.current_dir') || getPath(payload, 'cwd'), { mode: 'basename' });
  return [model, dir].filter(Boolean).join(' | ');
}

let raw = '';
process.stdin.setEncoding('utf8');
process.stdin.on('data', chunk => { raw += chunk; });
process.stdin.on('end', () => {
  let payload = {};
  try {
    payload = JSON.parse(raw || '{}') || {};
  } catch (e) {
    payload = {};
  }
  let out;
  try {
    out = render(payload);
  } catch (e) {
    try { out = fallback(payload); } catch (e2) { out = ''; }
  }
  process.stdout.write(out + '\n');
});
`;

// The export formats: a runnable script, a handover prompt, and a config file —
// plus the readers that turn any of those back into a config.


const SEGMENT_KEYS = [
  'id', 'label', 'emoji', 'source', 'format', 'showLabel', 'showEmoji',
  'line', 'color', 'hideValues', 'scaleMap', 'bold', 'dim', 'group'
];

const DEFAULT_INSTALL_PATH = 'C:/Users/<user>/.claude/statusline.js';
const MAX_LINES = 3;

function normaliseConfig(config) {
  const c = config || {};
  const separator = c.separator === undefined ? DEFAULT_SEPARATOR : c.separator;
  const given = Array.isArray(c.separators) ? c.separators : [];
  const separators = [];
  for (let i = 0; i < MAX_LINES; i++) {
    separators.push(typeof given[i] === 'string' ? given[i] : separator);
  }

  return {
    version: 2,
    separator,
    separators,
    dimSeparator: c.dimSeparator !== false,
    lineCount: Math.max(1, Math.min(MAX_LINES, Number(c.lineCount) || 1)),
    segments: (c.segments || []).map(segment => {
      const out = {};
      for (const key of SEGMENT_KEYS) {
        if (segment[key] !== undefined) out[key] = segment[key];
      }
      return out;
    })
  };
}

function generateScript(config) {
  const cfg = normaliseConfig(config);
  return [
    '#!/usr/bin/env node',
    '// Claude Code status line, generated by the Statusline Builder.',
    '//',
    '// Install by pointing settings.json at this file:',
    '//   "statusLine": { "type": "command", "command": "node <path to this file>" }',
    '//',
    '// Everything configurable lives in CFG below; the engine underneath is generic.',
    '// The builder can read this file back in, so keep the CFG block intact if you',
    '// want to keep editing it there.',
    '',
    'const CFG = ' + JSON.stringify(cfg, null, 2) + ';',
    RUNTIME_SOURCE.trim(),
    ''
  ].join('\n');
}

function generateConfigJson(config) {
  return JSON.stringify(normaliseConfig(config), null, 2);
}

function parseConfigJson(text) {
  const parsed = typeof text === 'string' ? JSON.parse(text) : text;
  if (!parsed || typeof parsed !== 'object') throw new Error(tt('err.notObject'));
  if (!Array.isArray(parsed.segments)) throw new Error(tt('err.noSegments'));

  const segments = parsed.segments.map((segment, index) => {
    if (!segment || typeof segment !== 'object') {
      throw new Error(tt('err.segmentShape', { index }));
    }
    // Fall back to the catalogue entry so an abbreviated config still works.
    // Blocks are user-made and have no catalogue entry, so they carry themselves.
    const base = isBlock(segment) ? {} : (CATALOG_BY_ID[segment.id] || {});
    if (!segment.source && !base.source) {
      throw new Error(tt('err.noSource', { id: segment.id || index }));
    }
    return { ...base, ...segment };
  });

  return { ...normaliseConfig({ ...parsed, segments }), segments };
}

// Pulls the CFG object literal back out of a generated statusline.js. The
// literal is written with JSON.stringify, so brace matching plus JSON.parse is
// enough — no evaluation of untrusted code.
function extractCfgLiteral(text) {
  const marker = /const\s+CFG\s*=\s*\{/.exec(String(text));
  if (!marker) return null;

  const source = String(text);
  const start = marker.index + marker[0].length - 1;
  let depth = 0;
  let quote = '';
  let escaped = false;

  for (let i = start; i < source.length; i++) {
    const ch = source[i];
    if (quote) {
      if (escaped) escaped = false;
      else if (ch === '\\') escaped = true;
      else if (ch === quote) quote = '';
      continue;
    }
    if (ch === '"' || ch === "'") { quote = ch; continue; }
    if (ch === '{') depth += 1;
    else if (ch === '}') {
      depth -= 1;
      if (depth === 0) return source.slice(start, i + 1);
    }
  }
  return null;
}

// Accepts a config JSON or a generated statusline.js and returns a config.
function parseAnyConfig(text) {
  const trimmed = String(text || '').trim();
  if (!trimmed) throw new Error(tt('err.empty'));

  if (trimmed.startsWith('{')) return parseConfigJson(trimmed);

  const literal = extractCfgLiteral(trimmed);
  if (literal) return parseConfigJson(literal);

  if (/\bjq\b/.test(trimmed) || /^#!.*\b(bash|sh)\b/m.test(trimmed)) {
    throw new Error(tt('err.bash'));
  }
  throw new Error(tt('err.noCfg'));
}
